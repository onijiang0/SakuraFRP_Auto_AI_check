name: Build compact runner image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile.slim
      - requirements.container.txt
      - main.py
      - ai_service.py
      - logger.py
      - sidecar.py
      - .github/workflows/runner-slim.yml
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sakura-test:local
      - name: Check image size and headless browser
        run: |
          test "$(docker save sakura-test:local | gzip -1 | wc -c)" -lt 800000000
          docker run --rm --entrypoint python sakura-test:local -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True); b.close(); p.stop()'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/onijiang0/sakurafrp-runner:slim
